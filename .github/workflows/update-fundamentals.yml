name: Update IDX Fundamentals, 20D ADTV & SBN Yield Curve Snapshot

on:
  schedule:
    # Runs weekdays at 23:00 UTC (06:00 WIB before IDX market open)
    - cron: '0 23 * * 1-5'
  workflow_dispatch:
    inputs:
      target_tickers:
        description: 'Optional comma-separated IDX tickers (e.g. MIKA,ARNA,SILO,HEAL for fast 15s test). Leave empty for full 956+ JCI catalog (IDX100 priority first).'
        required: false
        default: ''
      batch_limit:
        description: 'Optional max number of tickers to process in this run (e.g. 100 for top IDX100 liquid issuers). Leave empty for all.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  refresh-fundamentals:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch SBN 1Y/5Y/10Y Curve, Yahoo Fundamentals & 20D Volume ADTV
        env:
          TARGET_TICKERS: ${{ github.event.inputs.target_tickers }}
          BATCH_LIMIT: ${{ github.event.inputs.batch_limit }}
        run: |
          node scripts/fetch-fundamentals-snapshot.mjs

      - name: Commit and push updated fundamentals-snapshot.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/fundamentals-snapshot.json
          if git diff --staged --quiet; then
            echo "No changes in public/fundamentals-snapshot.json"
          else
            git commit -m "chore(data): automated IDX fundamentals, 20D ADTV & SBN curve refresh [skip ci]"
            git push
          fi
