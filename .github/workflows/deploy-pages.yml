name: Deploy Nostradamus Quant Terminal to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  schedule:
    # Automatically refresh Yahoo Finance Full JCI Stocks + Global Macro + News RSS across IDX trading hours (09:05, 10:05, 12:05, 14:05, 15:05, 16:05 WIB)
    - cron: '5 2,3,5,7,8,9 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Fetch Live Yahoo Finance Full JCI Snapshot, Macro & RSS
        run: node scripts/generate-static-market-bundle.mjs

      - name: Build Production Bundle (dist/ & docs/)
        env:
          VITE_REALTIME_WORKER_URL: ${{ secrets.VITE_REALTIME_WORKER_URL || vars.VITE_REALTIME_WORKER_URL || 'https://nostradamus-yahoo-proxy.feynman-wyckoff.workers.dev' }}
        run: npm run build

      - name: Commit Built Static Bundle & Snapshot to Branch (Supports Branch & Docs Pages Mode)
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/assets/ docs/index.html index.html public/static-market-snapshot.json docs/static-market-snapshot.json src/data/staticMarketSnapshot.json static-market-snapshot.json || true
          if ! git diff --cached --quiet; then
            git commit -m "chore(pages): auto-build & sync docs/ bundle and live IDX snapshot [skip ci]"
            git push origin HEAD:${{ github.ref_name }} || true
          fi

      - name: Configure GitHub Pages
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Build Artifact
        continue-on-error: true
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Wait for Artifact Metadata Indexing
        run: sleep 3

      - name: Deploy to GitHub Pages (Actions Mode)
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
