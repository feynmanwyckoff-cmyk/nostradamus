name: Deploy Nostradamus Quant Terminal to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  schedule:
    # Automatically refresh Yahoo Finance Full JCI Stocks + Global Macro + News RSS across IDX trading hours (09:05, 10:05, 12:05, 14:05, 15:05, 16:05 WIB)
    - cron: '5 2,3,5,7,8,9 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Fetch Live Yahoo Finance Full JCI Snapshot, Macro & RSS
        run: node scripts/generate-static-market-bundle.mjs

      - name: Build Production Bundle (dist/)
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Build Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
